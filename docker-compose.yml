# Development/demo stack. Production deployments should point DATABASE_URL at a
# managed PostgreSQL instance and drop the `db` service entirely.
#
# Host ports are deliberately non-default so this stack does not collide with a
# PostgreSQL or Rails process already running on the machine.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${DATABASE_NAME:-event_management_app_be_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DATABASE_HOST_PORT:-8695}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        RUBY_VERSION: "3.2.2"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      # Both of these are required in production; the app refuses to boot
      # without DEVISE_JWT_SECRET_KEY rather than falling back to a default.
      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY:?generate one with `bin/rails secret`}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?generate one with `bin/rails secret`}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME:-event_management_app_be_production}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    ports:
      - "${API_HOST_PORT:-8690}:3000"

volumes:
  pgdata:
